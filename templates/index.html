<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Clínica Médica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0;
        }
        .login-box {
            background-color: #fff; padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; width: 350px;
        }
        .login-box h2 { color: #1d3557; margin-bottom: 20px; }
        .login-box input {
            width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
        }
        .login-box button {
            width: 100%; padding: 10px; background-color: #1d3557; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px;
        }
        .login-box button:hover { background-color: #457b9d; }
    </style>
</head>
<body>
   <div class="login-box">
        <h2>Clínica Médica</h2>
        <form action="/fazer_login" method="POST">
            <input type="text" name="usuario" placeholder="Usuário" required>
            <input type="password" name="senha" placeholder="Senha" required>
            <button type="submit">Entrar no Sistema</button>
        </form>
        <p style="margin-top: 15px; font-size: 14px;">
            Não tem uma conta? <a href="/registrar" style="color: #1d3557;">Criar Login</a>
        </p>
    </div>
</body>
</html>
