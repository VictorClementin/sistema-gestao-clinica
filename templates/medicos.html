{% extends 'base.html' %}

{% block content %}
<div style="background: white; padding: 20px; border-radius: 8px;">
    <h2 style="color: #1d3557;">Cadastro de Médicos</h2>

    <form action="/medicos" method="POST" style="margin-bottom: 30px;">
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="text" name="nome" placeholder="Nome do Médico" required style="flex: 2; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            <input type="text" name="crm" placeholder="CRM" required style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="text" name="cpf" placeholder="CPF" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            <input type="text" name="telefone" placeholder="Telefone" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            <input type="email" name="email" placeholder="E-mail" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <button type="submit" style="background: #1d3557; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">
            Cadastrar Médico
        </button>
    </form>

    <h3 style="color: #1d3557;">Médicos Cadastrados</h3>
    <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
        <thead>
            <tr style="background-color: #1d3557; color: white;">
                <th style="padding: 10px; text-align: left;">ID</th>
                <th style="padding: 10px; text-align: left;">Nome</th>
                <th style="padding: 10px; text-align: left;">CRM</th>
                <th style="padding: 10px; text-align: left;">Telefone</th>
                <th style="padding: 10px; text-align: center;">Ação</th>
            </tr>
        </thead>
        <tbody>
            {% for medico in medicos %}
            <tr style="border-bottom: 1px solid #ddd;">
                <td style="padding: 10px;">{{ medico.id }}</td>
                <td style="padding: 10px;">{{ medico.nome }}</td>
                <td style="padding: 10px;">{{ medico.crm }}</td>
                <td style="padding: 10px;">{{ medico.telefone }}</td>
                <td style="padding: 10px; text-align: center;">
                    <a href="{{ url_for('deletar_medico', id=medico.id) }}" style="color: red; text-decoration: none; font-weight: bold;">Excluir</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5" style="padding: 15px; text-align: center; color: #666;">
                    Nenhum médico cadastrado ainda.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
